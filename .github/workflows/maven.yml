name: Maven CI with Checkstyle Bot

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ] # TRIGGER: Chạy khi có Pull Request vào main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: # Cấp quyền cho bot được viết comment vào PR
      pull-requests: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and Test
        run: mvn clean verify

      # INLINE FEEDBACK: Con bot Checkstyle sẽ soi lỗi và comment trực tiếp
      - name: Checkstyle Report
        uses: dbelyaev/action-checkstyle@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          level: 'warning'